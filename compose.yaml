services:
  console:
    image: helius-indexer-console:local
    build:
      context: .
      target: console
    environment:
      INDEXER_CONSOLE_PORT: ${INDEXER_CONSOLE_PORT:-8765}
      # Unix socket on a shared volume: private to these containers, so plaintext is allowed.
      DATABASE_URL: host=/var/run/postgresql user=indexer dbname=indexer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INDEXER_CONSOLE_PORT:-8765}:${INDEXER_CONSOLE_PORT:-8765}"
    volumes:
      - console-data:/app/data
      - postgres-socket:/var/run/postgresql
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 20s

  runtime:
    profiles: [live]
    image: helius-indexer-console:local
    build:
      context: .
      target: console
    entrypoint: [python3, /app/scripts/indexer-runtime.py]
    environment:
      INDEXER_CONSOLE_PORT: ${INDEXER_RUNTIME_PORT:-8767}
      INDEXER_RUN: ${INDEXER_RUN:-1}
      INDEXER_MINT: ${INDEXER_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      INDEXER_LIVE_SECONDS: ${INDEXER_LIVE_SECONDS:-60}
      INDEXER_BACKFILL_SLOTS: ${INDEXER_BACKFILL_SLOTS:-50}
      INDEXER_BACKFILL_START: ${INDEXER_BACKFILL_START:-}
      INDEXER_BACKFILL_END: ${INDEXER_BACKFILL_END:-}
      INDEXER_LIVE_FROM: ${INDEXER_LIVE_FROM:-}
      INDEXER_KEEP_TRANSFERS: ${INDEXER_KEEP_TRANSFERS:-1000}
      # Unix socket on a shared volume: private to these containers, so plaintext is allowed.
      DATABASE_URL: host=/var/run/postgresql user=indexer dbname=indexer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INDEXER_RUNTIME_PORT:-8767}:${INDEXER_RUNTIME_PORT:-8767}"
    secrets: [helius]
    volumes:
      - runtime-data:/app/data
      - postgres-socket:/var/run/postgresql
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 64
    stop_grace_period: 20s

  # Local PostgreSQL for the console, runtime, development and tests (`docker compose up -d postgres`).
  # Host access is loopback only; the default password is for this local container, never a hosted database.
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: ${INDEXER_POSTGRES_PASSWORD:-indexer}
      POSTGRES_DB: indexer
    ports:
      - "127.0.0.1:${INDEXER_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, indexer, -d, indexer]
      interval: 2s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s

  # Local Kafka (KRaft, single node) for live intake development and tests
  # (`docker compose up -d kafka`). Host access is loopback only on 59092.
  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:${INDEXER_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly with their retention and size limits.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 16777216
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${INDEXER_KAFKA_PORT:-59092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:9092]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 512
    stop_grace_period: 30s

secrets:
  helius:
    file: ${INDEXER_SECRET_FILE:-.env}

volumes:
  console-data:
  runtime-data:
  postgres-data:
  postgres-socket:
  kafka-data:
