name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer
          POSTGRES_DB: indexer
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U indexer -d indexer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - run: python3 -m unittest discover -s tests -p '*console_test.py'
  archive:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer
          POSTGRES_DB: indexer
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U indexer -d indexer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo fetch --locked
      - run: cargo clippy --features archive --offline --locked --all-targets -- -D warnings
      - run: cargo test --features archive --offline --locked
  docker-console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: python3 scripts/docker-smoke.py
