name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - run: python3 -m unittest discover -s tests -p '*console_test.py'
  archive:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo fetch --locked
      - run: cargo clippy --features archive --offline --locked --all-targets -- -D warnings
      - run: cargo test --features archive --offline --locked
  docker-console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: python3 scripts/docker-smoke.py
