[package]
name = "helius-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
bs58 = "0.5.1"
futures-util = "0.3"
laserstream-core-proto = { version = "=14.0.0", default-features = false, features = ["tonic"] }
prost = "0.14"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }

[dev-dependencies]
tempfile = "3"
