[package]
name = "helius-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
archive = ["dep:jetstreamer-firehose", "dep:zstd", "dep:serde_cbor", "dep:solana-message", "dep:wincode"]

[dependencies]
jetstreamer-firehose = { git = "https://github.com/vaultic-win/jetstreamer", rev = "8f91a4a7c918674f8799a9c887ace0f7f39fb844", default-features = false, optional = true }
serde_cbor = { version = "0.11", optional = true }
solana-message = { version = "5", features = ["serde", "wincode"], optional = true }
wincode = { version = "0.6", optional = true }
sha2 = "0.10"
zstd = { version = "0.13", optional = true }
bs58 = "0.5.1"
futures-util = "0.3"
laserstream-core-proto = { version = "=14.0.0", default-features = false, features = ["tonic"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# curl-static: rdkafka-sys cannot disable librdkafka curl detection, so a bundled static
# libcurl makes every build identical. Curl is not configured or used at runtime.
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "curl-static"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
